<header class="cl-topbar">
    <button type="button" class="cl-topbar__menu" id="sidebarToggle" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cl-icon-sidebar">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M9 3v18"></path>
        </svg>
    </button>
    <div class="cl-topbar__title">
        {% block page_title %}<h1>{% block topbar_heading %}CodeLens{% endblock %}</h1>{% endblock %}
        {% block topbar_subtitle %}{% endblock %}
    </div>
    <div class="cl-topbar__actions">
        {% block topbar_actions %}{% endblock %}
    </div>
</header>
