{% load static %}
<aside class="cl-sidebar" id="sidebar">
    <div class="cl-sidebar__header" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; width: 100%;">
        <a href="{% url 'home' %}" class="cl-sidebar__brand" style="margin-bottom: 0;">
            <span class="cl-sidebar__logo">
                <img src="{% static 'img/logo_light.png' %}" alt="CodeLens" class="cl-logo-img cl-logo-img--light" />
                <img src="{% static 'img/logo_dark.png' %}" alt="CodeLens" class="cl-logo-img cl-logo-img--dark" />
            </span>
            <span class="cl-sidebar__name">CodeLens</span>
        </a>
        <button type="button" class="cl-sidebar__close" id="sidebarCloseBtn" aria-label="Close sidebar" title="Close sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cl-icon-sidebar">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M9 3v18"></path>
            </svg>
        </button>
    </div>

    <nav class="cl-sidebar__nav">
        <span class="cl-sidebar__label">Workspace</span>
        <a href="{% url 'analyzer' %}" class="cl-sidebar__link{% if request.resolver_match.url_name == 'analyzer' %} is-active{% endif %}">
            <i class="fa-solid fa-code" aria-hidden="true"></i>
            <span>Analyzer</span>
        </a>
        {% if user.is_authenticated %}
        <span class="cl-sidebar__label">Insights</span>
        <a href="{% url 'dashboard' %}" class="cl-sidebar__link{% if request.resolver_match.url_name == 'dashboard' %} is-active{% endif %}">
            <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'history' %}" class="cl-sidebar__link{% if request.resolver_match.url_name == 'history' or request.resolver_match.url_name == 'functionalities' %} is-active{% endif %}">
            <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
            <span>History</span>
        </a>
        <a href="{% url 'usage_limits' %}" class="cl-sidebar__link{% if request.resolver_match.url_name == 'usage_limits' %} is-active{% endif %}">
            <i class="fa-solid fa-gauge-high" aria-hidden="true"></i>
            <span>Usage limits</span>
        </a>
        <a href="{% url 'upgrade_ultra' %}" class="cl-sidebar__link cl-sidebar__link--ultra{% if request.resolver_match.url_name == 'upgrade_ultra' %} is-active{% endif %}">
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span>Upgrade to Ultra</span>
        </a>
        {% endif %}

        <!-- About link at the very end of nav -->
        <a href="{% url 'about' %}" class="cl-sidebar__link{% if request.resolver_match.url_name == 'about' %} is-active{% endif %}" style="margin-top: auto;">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
            <span>About</span>
        </a>
    </nav>

    {% if not user.is_authenticated %}
    <div class="cl-sidebar__bottom">
        <a href="{% url 'login' %}" class="cl-btn cl-btn--primary cl-btn--block">Sign in</a>
    </div>
    {% endif %}
</aside>
